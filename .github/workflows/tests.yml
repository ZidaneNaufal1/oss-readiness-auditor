name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python examples/run_demo.py
      - name: Audit this checkout with a custom rule
        run: python oss_auditor.py . --config examples/config.json --format json
      - name: Install pinned build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Build wheel without downloading runtime dependencies
        run: python -m pip wheel . --no-build-isolation --no-deps --wheel-dir dist
      - name: Verify isolated installed command and module
        run: python scripts/verify_install.py dist/oss_readiness_auditor-0.2.0-py3-none-any.whl
